name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      # The runner image ships the NDK and build-tools; only the platform for
      # `targetSdkVersion` may be missing.
      - name: Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          "$sdkmanager" "platforms;android-35" > /dev/null

      - name: Pick the newest NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The activity, the Storage Access Framework bridge and the IME sink are
      # Java, so the APK is assembled by Gradle around this library.
      - name: Build the Rust library
        env:
          # Unstripped symbols made the APK 136 MB; stripping is what cargo-apk's
          # `strip = "strip"` used to do.
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o apps/wordcraft-android/android/app/src/main/jniLibs \
            build --release -p wordcraft-android

      # The runner's default JDK is newer than Gradle's Groovy can read
      # ("Unsupported class file major version 69"); Android's build tools want 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build the APK
        working-directory: apps/wordcraft-android/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show the APK
        run: ls -l apps/wordcraft-android/android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-debug
          path: apps/wordcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The app has no device in CI, so it runs in an emulator: logcat is the only way
  # to see a crash that happens when someone taps the page and types.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Pick the newest NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the x86_64 library
        env:
          CARGO_PROFILE_DEV_STRIP: symbols
        run: |
          set -euo pipefail
          cargo ndk -t x86_64 \
            -o apps/wordcraft-android/android/app/src/main/jniLibs \
            build -p wordcraft-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build the emulator APK
        working-directory: apps/wordcraft-android/android
        run: gradle assembleDebug -Pabis=x86_64 --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tap, type, and collect logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -x
            adb install -r apps/wordcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
            # The default AVD is 320x640, which is not a phone anyone has.
            adb shell wm size 720x1280
            adb shell wm density 320
            # Let the display configuration settle before the app starts, or the
            # app is born into a pending configuration change.
            sleep 20
            adb logcat -c
            adb shell am start -W -n ai.storyteller.wordcraft/.WordCraftActivity
            sleep 25
            adb exec-out screencap -p > started.png
            # Tap the page, a little below the ribbon: that is where typing starts.
            adb shell input tap 360 700
            sleep 6
            adb exec-out screencap -p > tapped.png
            adb shell dumpsys input_method | head -40
            adb shell input text "Hello"
            sleep 6
            adb exec-out screencap -p > typed.png
            adb shell input keyevent 67
            sleep 4
            adb exec-out screencap -p > deleted.png
            # The other half of the report: the keyboard came up at launch, and once
            # it was closed it never came back on a tap. Back closes it (the input
            # method takes that key, not the app), then a tap on the page has to
            # bring it back.
            adb shell input keyevent 4
            sleep 5
            adb exec-out screencap -p > keyboard_closed.png
            adb shell dumpsys input_method | grep -E "mInputShown|mServedView|isInputViewShown" | head -5
            adb shell input tap 360 700
            sleep 8
            adb exec-out screencap -p > keyboard_back.png
            adb shell input text " there"
            sleep 6
            adb exec-out screencap -p > retyped.png
            adb shell dumpsys input_method | grep -E "mInputShown|mServedView|isInputViewShown" | head -5
            adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mServedView" | head -5
            adb logcat -d > logcat.txt
            adb shell pidof ai.storyteller.wordcraft || echo "PROCESS GONE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            logcat.txt
            started.png
            tapped.png
            typed.png
            deleted.png
            keyboard_closed.png
            keyboard_back.png
            retyped.png
          if-no-files-found: warn

      - name: Show what happened
        if: always()
        run: |
          echo "=== crashes ==="
          grep -nE "FATAL EXCEPTION|AndroidRuntime|SIGSEGV|backtrace|panicked" logcat.txt | head -60 || true
          echo "=== wordcraft ==="
          grep -nE "WordCraft: |ai\.storyteller\.wordcraft.*died|PROCESS GONE" logcat.txt | tail -40 || true
          # A crash is a failed run, not something to read past.
          if grep -qE "FATAL EXCEPTION|Fatal signal|SIGSEGV" logcat.txt; then
            echo "::error::the app crashed"
            exit 1
          fi
          # The keyboard has to open on a tap after the user closed it, and the
          # last thing the app asked for is what the log shows.
          grep -nE "WordCraft: keyboard" logcat.txt || echo "no keyboard lines"
