[package]
name = "wordcraft-android"
description = "WordCraft on Android: the egui app with an Android activity shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids `unsafe`, but Android's entry points are `#[unsafe(no_mangle)]`
# symbols and the JNI bridge reads raw pointers, so this crate does not inherit those lints.

[lib]
name = "wordcraft_android"
crate-type = ["cdylib"]

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-control-key = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# `glow` paints through OpenGL ES, which every Android device has; wgpu would
# need Vulkan and a much larger binary.
eframe = { workspace = true, features = ["default_fonts", "glow", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
# The activity shell is Java (Storage Access Framework, the IME sink and the
# clipboard have no Rust-only route on Android), so the app talks to it through
# JNI. `android-activity` depends on jni 0.22 for its own internals; this older
# release is the one whose call API this crate's bridge is written against, and
# the two coexist because only raw VM pointers cross between them.
jni = "0.21"
